<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JOON Email Auth Test</title>
<style>body{font-family:system-ui,-apple-system,sans-serif;background:#f5f5f7;margin:0;padding:32px;color:#111}.card{max-width:460px;margin:40px auto;background:#fff;border-radius:24px;padding:28px;box-shadow:0 12px 40px #0001}h1{margin:0 0 8px}p{color:#666;line-height:1.5}input,button{box-sizing:border-box;width:100%;height:50px;border-radius:14px;margin-top:12px;font-size:16px}input{border:1px solid #ddd;padding:0 14px}button{border:0;background:#1677ff;color:white;font-weight:700}.secondary{background:#eee;color:#222}.status{margin-top:18px;white-space:pre-wrap;color:#333}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body><main class="card"><h1>JOON 인증 테스트</h1><p>삼성 PC의 같은 브라우저에서 이메일 가입 → 확인 링크 → JOON 복귀가 정상인지 확인하는 임시 화면입니다.</p><input id="email" type="email" placeholder="사용할 이메일"><input id="password" type="password" minlength="6" placeholder="JOON 테스트 비밀번호 (6자 이상)"><button id="signup">테스트 가입 + 인증메일 보내기</button><button id="check" class="secondary">현재 인증 상태 확인</button><div id="status" class="status">대기 중</div></main>
<script>
const sb=window.supabase.createClient('https://rvhqsgrlrumjwnukapny.supabase.co','sb_publishable_0qcdqSbgpRgYqSSlIwPpVA_wckk7bKY',{auth:{persistSession:true,detectSessionInUrl:true}});
const status=document.querySelector('#status');
async function showSession(){const {data,error}=await sb.auth.getSession();if(error){status.textContent='오류: '+error.message;return}const u=data.session?.user;status.textContent=u?('로그인됨\n이메일: '+(u.email||'-')+'\n이메일 확인: '+(u.email_confirmed_at?'완료':'아직 안 됨')):'현재 로그인 세션 없음';}
document.querySelector('#signup').onclick=async()=>{const email=document.querySelector('#email').value.trim(),password=document.querySelector('#password').value;if(!email||password.length<6){status.textContent='이메일과 6자 이상 JOON 테스트 비밀번호를 입력하세요.';return}status.textContent='인증메일 요청 중…';const redirectTo=location.origin+location.pathname;const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:redirectTo}});if(error){status.textContent='발송/가입 오류: '+error.message;return}status.textContent=data.session?'가입과 로그인 완료':'인증메일을 보냈습니다.\n삼성 PC에서 메일을 열고 확인 링크를 누른 뒤 이 화면으로 돌아오는지 확인하세요.';};
document.querySelector('#check').onclick=showSession;sb.auth.onAuthStateChange(()=>setTimeout(showSession,0));showSession();
</script></body></html>
