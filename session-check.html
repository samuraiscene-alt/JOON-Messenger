<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f8fc">
<title>JOON 세션 확인</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#f7f8fc;color:#182033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{max-width:520px;margin:10vh auto;padding:24px;border-radius:24px;background:#fff;box-shadow:0 12px 40px #17213a16}h1{margin:0 0 10px;font-size:24px}p{color:#596273;line-height:1.6}button{width:100%;padding:15px;border:0;border-radius:14px;background:#1677ff;color:#fff;font-size:16px;font-weight:700}.result{margin-top:18px;padding:16px;border-radius:14px;background:#f1f4f9;white-space:pre-wrap;line-height:1.7;overflow-wrap:anywhere}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
</head>
<body>
<main class="card">
<h1>JOON 세션 확인</h1>
<p>현재 Safari에 저장된 로그인 세션과 내 프로필 조회 결과만 확인합니다. 비밀번호와 로그인 토큰은 표시하거나 전송하지 않습니다.</p>
<button id="check" type="button">현재 세션 확인</button>
<div id="result" class="result">확인 버튼을 눌러주세요.</div>
</main>
<script>
const sb=window.supabase.createClient('https://rvhqsgrlrumjwnukapny.supabase.co','sb_publishable_0qcdqSbgpRgYqSSlIwPpVA_wckk7bKY',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const result=document.querySelector('#result');
document.querySelector('#check').onclick=async()=>{
 result.textContent='확인 중…';
 try{
  const {data,error}=await sb.auth.getSession();
  if(error)throw error;
  const user=data.session?.user;
  if(!user){result.textContent='저장된 로그인 세션 없음';return}
  const {data:profile,error:profileError}=await sb.from('joon_profiles').select('display_name').eq('id',user.id).maybeSingle();
  result.textContent=[
   '로그인 세션: 있음',
   '세션 확인 코드: '+user.id.slice(0,8),
   '계정 유형: '+(user.is_anonymous?'익명 계정':'이메일 계정'),
   profileError?'프로필 조회 오류: '+[profileError.code,profileError.message].filter(Boolean).join(' · '):profile?'프로필 조회: 성공 ('+(profile.display_name||'이름 없음')+')':'프로필 조회: 결과 없음'
  ].join('\n');
 }catch(error){result.textContent='확인 오류: '+(error?.message||String(error))}
};
</script>
</body>
</html>
